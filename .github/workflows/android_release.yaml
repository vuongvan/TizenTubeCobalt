name: android_release_universal

on:
  workflow_dispatch: # Allows manual triggering
  push:
    tags:
      - 'v*'

jobs:
  build-universal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          key: gradle-cache-${{ hashFiles('starboard/android/apk/**/*gradle*') }}
          path: |
            /root/.gradle/caches
            /root/.gradle/wrapper

      - name: Set up Cloud SDK
        uses: isarkis/setup-gcloud@40dce7857b354839efac498d3632050f568090b6

      - name: Set Android env vars
        run: |
          export ANDROID_HOME="$GITHUB_WORKSPACE/Android"
          mkdir -p "$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          unset ANDROID_SDK_ROOT
          echo "ANDROID_SDK_ROOT=" >> $GITHUB_ENV

      - name: Install GN
        run: |
          wget https://chrome-infra-packages.appspot.com/dl/gn/gn/linux-amd64/+/latest -O gn.zip
          unzip gn.zip -d gn_bin
          sudo mv gn_bin/gn /usr/local/bin/gn
          sudo chmod +x /usr/local/bin/gn

      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=$GITHUB_WORKSPACE:$PYTHONPATH" >> $GITHUB_ENV

      - name: GN (Universal Config)
        run: |
          # Note: target_cpu="x64" or "arm64" is often the host/primary, 
          # but Cobalt's universal builds usually require specific flags 
          # or multiple GN runs if the build system doesn't support fat binaries natively.
          # Here we use the standard android-arm64-v8a build with universal flags.
          gn gen out/android-universal_gold --args='target_platform="android-arm64" target_os="android" build_type="gold" sb_api_version=15'
          gn check out/android-universal_gold

      - name: Install build dependencies
        run: |
          sudo apt update && sudo apt install -qqy --no-install-recommends \
            bison clang libasound2-dev libgles2-mesa-dev libglib2.0-dev \
            libxcomposite-dev libxi-dev libxrender-dev nasm ninja-build \
            python3-venv ccache gcc-multilib \
            g++-multilib libc6-dev-i386
          ccache --max-size=20G
          bash ./starboard/tools/download_clang.sh
          bash ./starboard/android/shared/download_sdk.sh

      - name: Ensure Android debug keystore exists
        run: |
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            mkdir -p "$HOME/.android"
            keytool -genkey -v -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Cobalt Universal
        run: |
          NINJA_STATUS="[%e sec | %f/%t %u remaining | %c/sec | j%r] "
          # If your version of Cobalt supports it, this target bundles the ABIs
          ninja -C out/android-universal_gold cobalt_install

      - name: Upload Universal APK to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: out/android-universal_gold/cobalt.apk
          asset_name: cobalt-android-universal.apk
          tag: ${{ github.ref_name }}
          overwrite: true
