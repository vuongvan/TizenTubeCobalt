name: android_release_armv7a_powertech

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-armv7a:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          key: gradle-cache-${{ hashFiles('starboard/android/apk/**/*gradle*') }}
          path: |
            /root/.gradle/caches
            /root/.gradle/wrapper

      - name: Set up Cloud SDK
        uses: isarkis/setup-gcloud@40dce7857b354839efac498d3632050f568090b6

      - name: Set Android env vars
        run: |
          export MY_ANDROID_HOME="$GITHUB_WORKSPACE/Android"
          mkdir -p "$MY_ANDROID_HOME"
          echo "ANDROID_HOME=$MY_ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$MY_ANDROID_HOME" >> $GITHUB_ENV
          echo "GRADLE_OPTS=-Dorg.gradle.daemon=false" >> $GITHUB_ENV

      - name: Install GN
        run: |
          wget https://chrome-infra-packages.appspot.com/dl/gn/gn/linux-amd64/+/latest -O gn.zip
          unzip gn.zip -d gn_bin
          sudo mv gn_bin/gn /usr/local/bin/gn
          sudo chmod +x /usr/local/bin/gn

      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=$GITHUB_WORKSPACE:$PYTHONPATH" >> $GITHUB_ENV

      - name: Install build dependencies
        run: |
          sudo apt update && sudo apt install -qqy --no-install-recommends \
            bison clang libasound2-dev libgles2-mesa-dev libglib2.0-dev \
            libxcomposite-dev libxi-dev libxrender-dev nasm ninja-build \
            python3-venv ccache gcc-multilib \
            g++-multilib libc6-dev-i386
          ccache --max-size=20G
          bash ./starboard/tools/download_clang.sh
          bash ./starboard/android/shared/download_sdk.sh

      - name: Precise Modification and Disable Updates
        run: |
          echo "Applying modifications..."
          # 屏蔽 GMS 弹窗
          find . -name "GoogleApiAvailability.java" -exec sed -i 's/return showErrorDialogFragment/return false; \/\/ /g' {} +
          # 取消更新逻辑
          find . -type f -name "*.java" -exec sed -i 's/checkUpdate/disableUpdate/g' {} +
          find . -type f -name "*.java" -exec sed -i 's/isUpdateAvailable/false \/\/ /g' {} +
          find . -type f -name "*.cc" -exec sed -i 's/updater_->CheckForUpdate()/ \/\/ updater_->CheckForUpdate()/g' {} +
          # 屏蔽弹窗 UI
          find . -name "*.java" -exec sed -i 's/\.showAtLocation/\/\/ .showAtLocation/g' {} +
          # 品牌更名
          find . -type f \( -name "*.java" -o -name "*.xml" \) -exec sed -i 's/TizenTube/PowerTech/g' {} +
          find . -type f \( -name "*.java" -o -name "*.xml" \) -exec sed -i 's/tizentube/powertech/g' {} +
          # 捐赠链接
          find . -type f -name "*.java" -exec sed -i 's/buymeacoffee.com\/reisxd/powertech-store/g' {} +

      - name: Ensure Android debug keystore exists
        run: |
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            mkdir -p "$HOME/.android"
            keytool -genkey -v -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Compile ARM 32bit
        run: |
          gn gen out/android-arm_gold --args='target_platform="android-arm" target_os="android" target_cpu="arm" build_type="gold" sb_api_version=15'
          ninja -C out/android-arm_gold cobalt_install

      - name: Assemble Armv7a APK
        run: |
          # 1. 核心修复：创建扁平化的库目录，直接把 .so 放在 lib/ 下
          # 这样做是为了匹配 Gradle 报错中期待的路径
          mkdir -p out/merged_libs/lib
          
          # 2. 搜索并拷贝 libcobalt.so 到 lib 根目录
          find out/android-arm_gold -name "libcobalt.so" -exec cp -v {} out/merged_libs/lib/ \;

          # 3. 校验
          ls -l out/merged_libs/lib/libcobalt.so

          cd starboard/android/apk
          # 使用 -PcobaltLibraryDir 指向包含 .so 的直接父目录
          ./gradlew assembleRelease \
            -PcobaltBuildAbi="armeabi-v7a" \
            -PcobaltLibraryDir="$GITHUB_WORKSPACE/out/merged_libs/lib" \
            -PcobaltBuildType="gold" \
            -x lint -x test

      - name: Upload Armv7a APK
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: starboard/android/apk/app/build/outputs/apk/release/app-release.apk
          asset_name: PowerTech-Player-armv7a.apk
          tag: ${{ github.ref_name }}
          overwrite: true
