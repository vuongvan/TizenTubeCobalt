name: android_release_universal

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-universal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          key: gradle-cache-${{ hashFiles('starboard/android/apk/**/*gradle*') }}
          path: |
            /root/.gradle/caches
            /root/.gradle/wrapper

      - name: Set up Cloud SDK
        uses: isarkis/setup-gcloud@40dce7857b354839efac498d3632050f568090b6

      - name: Set Android env vars
        run: |
          export MY_ANDROID_HOME="$GITHUB_WORKSPACE/Android"
          mkdir -p "$MY_ANDROID_HOME"
          echo "ANDROID_HOME=$MY_ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$MY_ANDROID_HOME" >> $GITHUB_ENV
          echo "GRADLE_OPTS=-Dorg.gradle.daemon=false" >> $GITHUB_ENV

      - name: Install GN
        run: |
          wget https://chrome-infra-packages.appspot.com/dl/gn/gn/linux-amd64/+/latest -O gn.zip
          unzip gn.zip -d gn_bin
          sudo mv gn_bin/gn /usr/local/bin/gn
          sudo chmod +x /usr/local/bin/gn

      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=$GITHUB_WORKSPACE:$PYTHONPATH" >> $GITHUB_ENV

      - name: Install build dependencies
        run: |
          sudo apt update && sudo apt install -qqy --no-install-recommends \
            bison clang libasound2-dev libgles2-mesa-dev libglib2.0-dev \
            libxcomposite-dev libxi-dev libxrender-dev nasm ninja-build \
            python3-venv ccache gcc-multilib \
            g++-multilib libc6-dev-i386
          ccache --max-size=20G
          bash ./starboard/tools/download_clang.sh
          bash ./starboard/android/shared/download_sdk.sh

      - name: Ensure Android debug keystore exists
        run: |
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            mkdir -p "$HOME/.android"
            keytool -genkey -v -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      # 步骤 1: 编译 arm64-v8a
      - name: Compile ARM 64bit
        run: |
          gn gen out/android-arm64_gold --args='target_platform="android-arm64" target_os="android" target_cpu="arm64" build_type="gold" sb_api_version=15'
          ninja -C out/android-arm64_gold cobalt_install

      # 步骤 2: 编译 armeabi-v7a
      - name: Compile ARM 32bit
        run: |
          gn gen out/android-arm_gold --args='target_platform="android-arm" target_os="android" target_cpu="arm" build_type="gold" sb_api_version=15'
          ninja -C out/android-arm_gold cobalt_install

      # 步骤 3: 编译 x86
      - name: Compile x86
        run: |
          gn gen out/android-x86_gold --args='target_platform="android-x86" target_os="android" target_cpu="x86" build_type="gold" sb_api_version=15'
          ninja -C out/android-x86_gold cobalt_install

      # 步骤 4: 合并所有架构的库并打包
      - name: Assemble Universal APK (ARM64 + ARM32 + x86)
        run: |
          # 创建统一的合并库目录
          mkdir -p out/merged_libs/lib/arm64-v8a
          mkdir -p out/merged_libs/lib/armeabi-v7a
          mkdir -p out/merged_libs/lib/x86
          
          # 查找并复制对应的 .so 文件
          find out/android-arm64_gold -name "libcobalt.so" -exec cp {} out/merged_libs/lib/arm64-v8a/ \;
          find out/android-arm_gold -name "libcobalt.so" -exec cp {} out/merged_libs/lib/armeabi-v7a/ \;
          find out/android-x86_gold -name "libcobalt.so" -exec cp {} out/merged_libs/lib/x86/ \;

          cd starboard/android/apk
          # 传入 Gradle 参数进行打包
          # -PcobaltBuildAbi 包含所有需要的架构
          # -PcobaltLibraryDir 指向我们刚才手动合并的 .so 目录
          ./gradlew assembleRelease \
            -PcobaltBuildAbi="arm64-v8a,armeabi-v7a,x86" \
            -PcobaltLibraryDir="$GITHUB_WORKSPACE/out/merged_libs/lib"

      - name: Upload Universal APK
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: starboard/android/apk/app/build/outputs/apk/release/app-release.apk
          asset_name: cobalt-android-universal-x86.apk
          tag: ${{ github.ref_name }}
          overwrite: true
