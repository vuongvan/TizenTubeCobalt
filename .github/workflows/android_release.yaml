name: android_release_armv7a_powertech

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-armv7a:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Android env vars
        run: |
          export MY_ANDROID_HOME="$GITHUB_WORKSPACE/Android"
          mkdir -p "$MY_ANDROID_HOME"
          echo "ANDROID_HOME=$MY_ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$MY_ANDROID_HOME" >> $GITHUB_ENV

      - name: Install GN & Dependencies
        run: |
          sudo apt update && sudo apt install -qqy --no-install-recommends \
            bison clang libasound2-dev libgles2-mesa-dev libglib2.0-dev \
            libxcomposite-dev libxi-dev libxrender-dev nasm ninja-build \
            python3-venv ccache gcc-multilib g++-multilib libc6-dev-i386 unzip
          wget https://chrome-infra-packages.appspot.com/dl/gn/gn/linux-amd64/+/latest -O gn.zip
          unzip gn.zip -d gn_bin && sudo mv gn_bin/gn /usr/local/bin/gn && sudo chmod +x /usr/local/bin/gn
          echo "PYTHONPATH=$GITHUB_WORKSPACE:$PYTHONPATH" >> $GITHUB_ENV

      - name: Download SDK & Clang
        run: |
          bash ./starboard/tools/download_clang.sh
          bash ./starboard/android/shared/download_sdk.sh

      - name: PowerTech Deep Modifications
        run: |
          echo "Starting deep modification..."
          
          # 1. 彻底禁用更新逻辑：让所有更新检查直接返回 false
          find . -type f -name "*.java" -exec sed -i 's/public boolean isUpdateAvailable/public boolean isUpdateAvailable() { return false; } \/\/ /g' {} +
          find . -type f -name "*.java" -exec sed -i 's/checkUpdate/disableUpdate/g' {} +
          find . -type f -name "*.cc" -exec sed -i 's/updater_->CheckForUpdate()/ \/* disabled *\/ /g' {} +

          # 2. 屏蔽 GMS 和各种弹窗
          find . -name "GoogleApiAvailability.java" -exec sed -i 's/return showErrorDialogFragment/return false; \/\/ /g' {} +
          find . -name "*.java" -exec sed -i 's/\.showAtLocation/\/\/ .showAtLocation/g' {} +

          # 3. 品牌重塑：不仅改 Java/XML，还要修改 .grd, .js, .json (Cobalt UI 核心)
          # 注意：这里采用了区分大小写的两种替换
          find . -type f \( -name "*.java" -o -name "*.xml" -o -name "*.grd" -o -name "*.grdp" -o -name "*.js" -o -name "*.json" \) -exec sed -i 's/TizenTube/PowerTech/g' {} +
          find . -type f \( -name "*.java" -o -name "*.xml" -o -name "*.grd" -o -name "*.grdp" -o -name "*.js" -o -name "*.json" \) -exec sed -i 's/tizentube/powertech/g' {} +

          # 4. 修改应用包名显示（针对 strings.xml）
          find . -name "strings.xml" -exec sed -i 's/TizenTube/PowerTech/g' {} +

      - name: Ensure Android debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkey -v -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: GN (Generate Armv7a Config)
        run: |
          # 核心：增加 sb_evergreen_compatible_package=false 彻底切断自动更新机制
          gn gen out/android-armv7a_gold --args='target_platform="android-arm" target_os="android" target_cpu="arm" build_type="gold" sb_api_version=15 sb_evergreen_compatible_package=false'

      - name: Build Cobalt (Ninja)
        run: |
          export ANDROID_HOME=$GITHUB_WORKSPACE/Android
          export ANDROID_SDK_ROOT=$GITHUB_WORKSPACE/Android
          # 编译前清理缓存，确保修改生效
          ninja -C out/android-armv7a_gold -t clean
          ninja -C out/android-armv7a_gold cobalt_install

      - name: Upload PowerTech APK
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: out/android-armv7a_gold/cobalt.apk
          asset_name: PowerTech-Player-armv7a.apk
          tag: main
          overwrite: true
