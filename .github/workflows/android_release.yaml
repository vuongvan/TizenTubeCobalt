name: android_release_x86_powertech_pure

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-x86:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Android env vars
        run: |
          export MY_ANDROID_HOME="$GITHUB_WORKSPACE/Android"
          mkdir -p "$MY_ANDROID_HOME"
          echo "ANDROID_HOME=$MY_ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$MY_ANDROID_HOME" >> $GITHUB_ENV

      - name: Install GN & Dependencies
        run: |
          sudo apt update && sudo apt install -qqy --no-install-recommends \
            bison clang libasound2-dev libgles2-mesa-dev libglib2.0-dev \
            libxcomposite-dev libxi-dev libxrender-dev nasm ninja-build \
            python3-venv ccache gcc-multilib g++-multilib libc6-dev-i386 unzip
          wget https://chrome-infra-packages.appspot.com/dl/gn/gn/linux-amd64/+/latest -O gn.zip
          unzip gn.zip -d gn_bin && sudo mv gn_bin/gn /usr/local/bin/gn && sudo chmod +x /usr/local/bin/gn
          echo "PYTHONPATH=$GITHUB_WORKSPACE:$PYTHONPATH" >> $GITHUB_ENV

      - name: Download SDK & Clang
        run: |
          bash ./starboard/tools/download_clang.sh
          bash ./starboard/android/shared/download_sdk.sh

      - name: PowerTech Deep Modifications (Deep Smali & Logo Replacement)
        run: |
          echo "Starting Deep Sterilization of Updates and Dialogs..."
          
          # ==============================================================================
          # 1. 【彻底去弹窗 & 去更新】Smali 镂空打击 (针对 Java 层编译后的代码)
          # 此操作将删除函数体，强制返回，彻底废除功能。
          # ==============================================================================
          
          # 拦截所有基于 PopupWindow 的弹窗 (通常用于显示 You're signed out)
          find . -name "*.java" -exec sed -i '/void showAtLocation/,/}/c\    public void showAtLocation(android.view.View parent, int gravity, int x, int y) { return; }' {} +
          
          # 拦截所有基于 Dialog 的弹窗 (通常用于更新提示)
          find . -name "*.java" -exec sed -i '/void show()/,/}/c\    public void show() { return; }' {} +

          # 彻底镂空 TizenTube 自定义的更新检查类
          # 强制让 isUpdateAvailable 永远返回 false
          find . -type f -name "*.java" -exec sed -i '/public boolean isUpdateAvailable/,/}/c\    public boolean isUpdateAvailable() { return false; }' {} +

          # 屏蔽 GMS 弹窗
          find . -name "GoogleApiAvailability.java" -exec sed -i 's/return showErrorDialogFragment/return false; \/\/ /g' {} +

          # ==============================================================================
          # 2. 【品牌修改：由于 UI 远程加载无法修改文字，这里强制替换 Logo 图片】
          # 我们将用一个通用的 PowerTech 风格图标替换 TizenTube 安全盾牌
          # ==============================================================================
          echo "Replacing TizenTube Logo with PowerTech Logo..."
          
          # 创建一个简单的 PowerTech Logo (这里用一段文本代替图标，实际操作中建议准备好 png 文件)
          # 注意：这里需要你准备一个名为 powertech_logo.png 的文件在仓库根目录
          # 如果没有文件，这里会报错停止。为了 Action 运行，我这里改为“如果存在则替换”。
          if [ -f "powertech_logo.png" ]; then
            find . -name "splash_logo.png" -exec cp -v "powertech_logo.png" {} \;
            find . -name "ic_launcher.png" -exec cp -v "powertech_logo.png" {} \;
          else
            echo "Warning: powertech_logo.png not found in repository root. Application icon will NOT be replaced."
          fi

          # 全局替换 strings.xml 里的名字，至少确保应用安装时的名字是 PowerTech
          find . -name "strings.xml" -exec sed -i 's/TizenTube/PowerTech/g' {} +

      - name: Ensure Android debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkey -v -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: GN (Generate x86 Config)
        run: |
          # 核心修改：target_cpu="x86" (32位 x86)
          # 彻底切断 Evergreen
          gn gen out/android-x86_gold --args='target_platform="android-x86" target_os="android" target_cpu="x86" build_type="gold" sb_api_version=15 sb_evergreen_compatible_package=false'

      - name: Build Cobalt x86 (Ninja)
        run: |
          export ANDROID_HOME=$GITHUB_WORKSPACE/Android
          export ANDROID_SDK_ROOT=$GITHUB_WORKSPACE/Android
          # 清理缓存
          ninja -C out/android-x86_gold -t clean
          ninja -C out/android-x86_gold cobalt_install

      - name: Upload PowerTech x86 APK
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: out/android-x86_gold/cobalt.apk
          asset_name: PowerTech-Player-x86.apk
          tag: main
          overwrite: true
